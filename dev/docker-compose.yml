# A throwaway Hatchet for developing starci, the same hatchet-lite version that
# runs on luigi. Nothing here is shared with any real instance.
#
#   docker compose -f dev/docker-compose.yml up -d
#   dev/token.sh > dev/.env             # worker credentials for this stack
#
# Dashboard: http://localhost:18888  (admin@example.com / Admin123!!)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 2s
      timeout: 5s
      retries: 30

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18888:8888" # dashboard
      - "17077:7077" # gRPC, for workers
    environment:
      DATABASE_URL: postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_URL: http://localhost:18888
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_INSECURE: "t"
      # What the engine tells workers to dial: the host-side port.
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:17077
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet_config:/config

volumes:
  hatchet_config:
