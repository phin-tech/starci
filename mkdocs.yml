site_name: starci
site_url: https://docs.phin.tech/starci/
site_description: CI defined as a script instead of YAML.
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

# dottie.js plays the drawings in docs/animations, straight from the .dottie file.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/@phin-tech/dottie@0.6.2/dist/dottie-player.min.js

# Built with Zensical, which reads this file (dev/docs.sh). docs/examples is a
# copy of examples/, made at build time: the scripts and what they compile to
# are downloads, not pages.
