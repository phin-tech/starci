# Generated by `starci compile` from go.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this repository's Actions cache, which GitHub
#    scopes by branch and evicts when old. starci's own store has neither
#    limit.

name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  vet:
    name: "vet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**/*.go
            /go.mod
            /go.sum
      - name: "Tool: go"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/go"
          curl -fsSL 'https://go.dev/dl/go1.26.5.{os}-amd64.tar.gz' -o "$RUNNER_TEMP/go.download"
          echo "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053  $RUNNER_TEMP/go.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/go.download" -C "$RUNNER_TEMP/starci-tools/go"
      - name: "Cache: go-build"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-cache/go-build
          key: starci-cache-go-build-${{ github.run_id }}
          restore-keys: starci-cache-go-build-
      - name: "Cache: go-mod"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-cache/go-mod
          key: starci-cache-go-mod-${{ github.run_id }}
          restore-keys: starci-cache-go-mod-
      - name: "vet"
        env:
          STARCI_RUN: |-
            go vet ./...
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          mkdir -p "$RUNNER_TEMP/starci-cache/go-build"
          mkdir -p "$RUNNER_TEMP/starci-cache/go-mod"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            'CGO_ENABLED=0' \
            GOCACHE="$RUNNER_TEMP/starci-cache/go-build" \
            GOMODCACHE="$RUNNER_TEMP/starci-cache/go-mod" \
            PATH="$RUNNER_TEMP/starci-tools/go/go/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"

  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**/*.go
            /go.mod
            /go.sum
      - name: "Tool: go"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/go"
