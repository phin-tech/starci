          tar -xf "$RUNNER_TEMP/go.download" -C "$RUNNER_TEMP/starci-tools/go"
      - name: "Cache: go-build"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-cache/go-build
          key: starci-cache-go-build-${{ github.run_id }}
          restore-keys: starci-cache-go-build-
      - name: "Cache: go-mod"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-cache/go-mod
          key: starci-cache-go-mod-${{ github.run_id }}
          restore-keys: starci-cache-go-mod-
      - name: "test"
        env:
          STARCI_RUN: |-
            go test ./...
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          mkdir -p "$RUNNER_TEMP/starci-cache/go-build"
          mkdir -p "$RUNNER_TEMP/starci-cache/go-mod"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            'CGO_ENABLED=0' \
            GOCACHE="$RUNNER_TEMP/starci-cache/go-build" \
            GOMODCACHE="$RUNNER_TEMP/starci-cache/go-mod" \
            PATH="$RUNNER_TEMP/starci-tools/go/go/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"

  build-linux-amd64:
    name: "build linux/amd64"
    runs-on: ubuntu-latest
    needs: [vet, test]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**/*.go
            /go.mod
            /go.sum
      - name: "Tool: go"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/go"
