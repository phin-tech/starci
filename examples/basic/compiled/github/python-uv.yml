# Generated by `starci compile` from python-uv.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this repository's Actions cache, which GitHub
#    scopes by branch and evicts when old. starci's own store has neither
#    limit.

name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: "format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/**/*.py
            /tests/**/*.py
            /uv.lock
      - name: Has this already passed with these inputs?
        id: passed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-passed
          key: starci-passed-format-9c753dc6e2fbc8d7-${{ hashFiles('pyproject.toml', 'pyproject.toml/**', 'src/**/*.py', 'tests/**/*.py', 'uv.lock', 'uv.lock/**') }}
      - name: "Tool: uv"
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/uv"
          curl -fsSL 'https://github.com/astral-sh/uv/releases/download/0.12.1/uv-x86_64-unknown-linux-gnu.tar.gz' -o "$RUNNER_TEMP/uv.download"
          echo "90b2f223fb69d19db49e117da601f64978593417988530aa733d456141b4bcbb  $RUNNER_TEMP/uv.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/uv.download" -C "$RUNNER_TEMP/starci-tools/uv"
      - name: Image with ca-certificates, libpq5
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          docker build -q -t starci-env-format - <<'DOCKERFILE'
          FROM debian:12-slim
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates libpq5 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: "Cache: uv"
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-cache/uv
          key: starci-cache-uv-${{ github.run_id }}
          restore-keys: starci-cache-uv-
      - name: "format"
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          STARCI_RUN: |-
            uv sync --frozen && uv run --no-sync ruff format --check src tests
        run: |
          image_path=$(docker image inspect starci-env-format --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^PATH=//p')
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -v "$RUNNER_TEMP/starci-tools/uv:/opt/starci/tools/uv:ro" \
            -v "$RUNNER_TEMP/starci-cache/uv:/root/.cache/uv" \
            -e "PATH=/opt/starci/tools/uv/uv-x86_64-unknown-linux-gnu:$image_path" \
            starci-env-format sh -c "$STARCI_RUN"
      - name: Remember this pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/starci-passed" && date > "$RUNNER_TEMP/starci-passed/at"

