# Generated by `starci compile` from diamond.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this repository's Actions cache, which GitHub
#    scopes by branch and evicts when old. starci's own store has neither
#    limit.

name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Tool: node"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/node"
          curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "$RUNNER_TEMP/node.download"
          echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  $RUNNER_TEMP/node.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/node.download" -C "$RUNNER_TEMP/starci-tools/node"
      - name: "build"
        env:
          STARCI_RUN: |-
            npm ci && npm run build
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            PATH="$RUNNER_TEMP/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"

  lint:
    name: "lint"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: "Tool: node"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/node"
          curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "$RUNNER_TEMP/node.download"
          echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  $RUNNER_TEMP/node.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/node.download" -C "$RUNNER_TEMP/starci-tools/node"
      - name: "lint"
        env:
          STARCI_RUN: |-
            npm ci && npm run lint
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            PATH="$RUNNER_TEMP/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"

  test:
    name: "test"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: "Tool: node"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/node"
          curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "$RUNNER_TEMP/node.download"
          echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  $RUNNER_TEMP/node.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/node.download" -C "$RUNNER_TEMP/starci-tools/node"
      - name: "test"
        env:
          STARCI_RUN: |-
            npm ci && npm test
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            PATH="$RUNNER_TEMP/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"

  package:
    name: "package"
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: "Tool: node"
        run: |
          mkdir -p "$RUNNER_TEMP/starci-tools/node"
          curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "$RUNNER_TEMP/node.download"
          echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  $RUNNER_TEMP/node.download" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/node.download" -C "$RUNNER_TEMP/starci-tools/node"
      - name: "package"
        env:
          STARCI_RUN: |-
            npm ci && npm pack
        run: |
          starci_root="$(mktemp -d)"
          mkdir "$starci_root/home" "$starci_root/tmp"
          env -i \
            HOME="$starci_root/home" \
            TMPDIR="$starci_root/tmp" \
            LANG=C.UTF-8 \
            STARCI_WORKSPACE="$PWD" \
            PATH="$RUNNER_TEMP/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
            /bin/sh -c "$STARCI_RUN"
