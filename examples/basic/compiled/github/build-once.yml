# Generated by `starci compile` from build-once.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this repository's Actions cache, which GitHub
#    scopes by branch and evicts when old. starci's own store has neither
#    limit.
#  - Artifacts are handed from job to job as Actions artifacts of the run,
#    packed with tar so that executable files stay executable, and expire with
#    them. What a job kept is also in its record of a pass, so a job skipped
#    because it passed before still hands it on.

name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    outputs:
      kept-1: ${{ steps.kept.outputs.kept-1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /cmd
            /go.mod
            /go.sum
            /internal
      - name: Has this already passed with these inputs?
        id: passed
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/starci-passed
            ${{ runner.temp }}/starci-kept
          key: starci-passed-build-419567f44a988eb2-${{ hashFiles('cmd', 'cmd/**', 'go.mod', 'go.mod/**', 'go.sum', 'go.sum/**', 'internal', 'internal/**') }}
      - name: "build"
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          STARCI_RUN: |-
            CGO_ENABLED=0 go build -o out/app ./cmd/app
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            golang:1.23-bookworm sh -c "$STARCI_RUN"
      - name: "Keep out/app"
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/starci-kept" && mkdir -p "$RUNNER_TEMP/starci-kept"
          if [ ! -e 'out/app' ]; then echo 'keep out/app: the step passed without making it'; exit 1; fi
          mkdir -p "$(dirname "$RUNNER_TEMP/starci-kept"/'out/app')" && cp -R 'out/app' "$RUNNER_TEMP/starci-kept"/'out/app'
      - name: Remember this pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/starci-passed" && date > "$RUNNER_TEMP/starci-passed/at"
      - name: The hash of what it kept
        id: kept
        run: |
          kept_hash() { find "$1" -type f | LC_ALL=C sort | while IFS= read -r f; do printf '%s %s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$([ -x "$f" ] && echo x || echo -)" "${f#"$1"}"; done | sha256sum | cut -c1-64; }
          cd "$RUNNER_TEMP/starci-kept"
          echo "kept-1=$(kept_hash 'out/app')" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/starci-hand-on" && tar -cf "$RUNNER_TEMP/starci-hand-on/kept.tar" .
      - name: Hand on what it kept
        uses: actions/upload-artifact@v4
        with:
          name: starci-build
          path: ${{ runner.temp }}/starci-hand-on/kept.tar

  smoke-debian:
    name: "smoke debian"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
      - name: Has this already passed with these inputs?
        id: passed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-passed
          key: starci-passed-smoke-debian-20fed0bf02c0c461-${{ hashFiles('README.md', 'README.md/**') }}-${{ needs.build.outputs.kept-1 }}
      - name: "Artifacts of build"
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: starci-build
          path: ${{ runner.temp }}/starci-given/build
      - name: Put the artifacts in place
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/starci-given/build"/files && tar -xf "$RUNNER_TEMP/starci-given/build"/kept.tar -C "$RUNNER_TEMP/starci-given/build"/files
          if [ -e 'app' ]; then echo 'artifact at app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
          mkdir -p "$(dirname 'app')" && cp -R "$RUNNER_TEMP/starci-given/build/files"/'out/app' 'app'
      - name: "smoke debian"
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          STARCI_RUN: |-
            ./app --version
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:12-slim sh -c "$STARCI_RUN"
      - name: Remember this pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/starci-passed" && date > "$RUNNER_TEMP/starci-passed/at"

  smoke-alpine:
    name: "smoke alpine"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
      - name: Has this already passed with these inputs?
        id: passed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-passed
          key: starci-passed-smoke-alpine-8db3eef2e9c9b4f7-${{ hashFiles('README.md', 'README.md/**') }}-${{ needs.build.outputs.kept-1 }}
      - name: "Artifacts of build"
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: starci-build
          path: ${{ runner.temp }}/starci-given/build
      - name: Put the artifacts in place
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/starci-given/build"/files && tar -xf "$RUNNER_TEMP/starci-given/build"/kept.tar -C "$RUNNER_TEMP/starci-given/build"/files
          if [ -e 'app' ]; then echo 'artifact at app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
          mkdir -p "$(dirname 'app')" && cp -R "$RUNNER_TEMP/starci-given/build/files"/'out/app' 'app'
      - name: "smoke alpine"
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          STARCI_RUN: |-
            ./app --version
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            alpine:3 sh -c "$STARCI_RUN"
      - name: Remember this pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/starci-passed" && date > "$RUNNER_TEMP/starci-passed/at"

  end-to-end:
    name: "end to end"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /e2e
      - name: Has this already passed with these inputs?
        id: passed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/starci-passed
          key: starci-passed-end-to-end-9adf421bd96d2346-${{ hashFiles('e2e', 'e2e/**') }}-${{ needs.build.outputs.kept-1 }}
      - name: "Artifacts of build"
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: starci-build
          path: ${{ runner.temp }}/starci-given/build
      - name: Put the artifacts in place
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/starci-given/build"/files && tar -xf "$RUNNER_TEMP/starci-given/build"/kept.tar -C "$RUNNER_TEMP/starci-given/build"/files
          if [ -e 'bin/app' ]; then echo 'artifact at bin/app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
          mkdir -p "$(dirname 'bin/app')" && cp -R "$RUNNER_TEMP/starci-given/build/files"/'out/app' 'bin/app'
      - name: "end to end"
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          STARCI_RUN: |-
            APP=./bin/app ./e2e/run.sh
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:12-slim sh -c "$STARCI_RUN"
      - name: Remember this pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/starci-passed" && date > "$RUNNER_TEMP/starci-passed/at"
