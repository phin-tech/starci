# Generated by `starci compile --target circleci` from diamond.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this project's CircleCI cache, which expires.
#    starci's own store does not.

version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Tool: node"
          command: |
            mkdir -p "$HOME/starci-tools/node"
            curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
            echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
            tar -xf "/tmp/node.download" -C "$HOME/starci-tools/node"
      - run:
          name: "build"
          environment:
            STARCI_RUN: |-
              npm ci && npm run build
          command: |
            starci_root="$(mktemp -d)"
            mkdir "$starci_root/home" "$starci_root/tmp"
            env -i \
              HOME="$starci_root/home" \
              TMPDIR="$starci_root/tmp" \
              LANG=C.UTF-8 \
              STARCI_WORKSPACE="$PWD" \
              PATH="$HOME/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
              /bin/sh -c "$STARCI_RUN"

  lint:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Tool: node"
          command: |
            mkdir -p "$HOME/starci-tools/node"
            curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
            echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
            tar -xf "/tmp/node.download" -C "$HOME/starci-tools/node"
      - run:
          name: "lint"
          environment:
            STARCI_RUN: |-
              npm ci && npm run lint
          command: |
            starci_root="$(mktemp -d)"
            mkdir "$starci_root/home" "$starci_root/tmp"
            env -i \
              HOME="$starci_root/home" \
              TMPDIR="$starci_root/tmp" \
              LANG=C.UTF-8 \
              STARCI_WORKSPACE="$PWD" \
              PATH="$HOME/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
              /bin/sh -c "$STARCI_RUN"

  test:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Tool: node"
          command: |
            mkdir -p "$HOME/starci-tools/node"
            curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
            echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
            tar -xf "/tmp/node.download" -C "$HOME/starci-tools/node"
      - run:
          name: "test"
          environment:
            STARCI_RUN: |-
              npm ci && npm test
          command: |
            starci_root="$(mktemp -d)"
            mkdir "$starci_root/home" "$starci_root/tmp"
            env -i \
              HOME="$starci_root/home" \
              TMPDIR="$starci_root/tmp" \
              LANG=C.UTF-8 \
              STARCI_WORKSPACE="$PWD" \
              PATH="$HOME/starci-tools/node/node-v22.23.4-{os}-x64/bin:""$PATH" \
              /bin/sh -c "$STARCI_RUN"

  package:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Tool: node"
          command: |
            mkdir -p "$HOME/starci-tools/node"
            curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
            echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
            tar -xf "/tmp/node.download" -C "$HOME/starci-tools/node"
      - run:
          name: "package"
          environment:
            STARCI_RUN: |-
