# Generated by `starci compile --target circleci` from helpers.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - The script reads ctx.changed_dirs, so its plan depends on the commit. This
#    file is the plan for a commit about which nothing is known, and is the
#    same for every push: steps the script would add or drop for a particular
#    branch or set of changed files are not represented.
#  - Passes are remembered in this project's CircleCI cache, which expires.
#    starci's own store does not.

version: 2.1

jobs:
  ui-lint:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/ui'
      - run:
          name: "Identify the inputs"
          command: |
            git ls-files -s -- ':(top,literal)ui' > /tmp/starci-inputs
      - restore_cache:
          name: Has this already passed with these inputs?
          keys:
            - starci-passed-ui-lint-c037eb6d9c922cc2-{{ checksum "/tmp/starci-inputs" }}
      - run:
          name: "Stop here if it has"
          command: |
            if [ -e ~/starci-passed/at ]; then
              echo "Passed before with the same inputs, on $(cat ~/starci-passed/at). Nothing to do."
              circleci-agent step halt
            fi
      - run:
          name: "ui lint"
          environment:
            STARCI_RUN: |-
              cd ui && npm ci && npm run lint
          command: |
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              node:22-bookworm-slim sh -c "$STARCI_RUN"
      - run:
          name: "Remember this pass"
          command: |
            mkdir -p ~/starci-passed && date > ~/starci-passed/at
      - save_cache:
          key: starci-passed-ui-lint-c037eb6d9c922cc2-{{ checksum "/tmp/starci-inputs" }}
          paths:
            - ~/starci-passed

  ui-test:
    machine:
