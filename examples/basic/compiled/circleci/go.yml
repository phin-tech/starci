# Generated by `starci compile --target circleci` from go.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this project's CircleCI cache, which expires.
#    starci's own store does not.

version: 2.1

jobs:
  vet:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/**/*.go' '/go.mod' '/go.sum'
      - run:
          name: "Tool: go"
          command: |
            mkdir -p "$HOME/starci-tools/go"
            curl -fsSL 'https://go.dev/dl/go1.26.5.{os}-amd64.tar.gz' -o "/tmp/go.download"
            echo "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053  /tmp/go.download" | sha256sum -c -
            tar -xf "/tmp/go.download" -C "$HOME/starci-tools/go"
      - restore_cache:
          name: "Cache: go-build"
          keys:
            - starci-cache-go-build-
      - restore_cache:
          name: "Cache: go-mod"
          keys:
            - starci-cache-go-mod-
      - run:
          name: "vet"
          environment:
            STARCI_RUN: |-
              go vet ./...
          command: |
            starci_root="$(mktemp -d)"
            mkdir "$starci_root/home" "$starci_root/tmp"
            mkdir -p "$HOME/starci-cache/go-build"
            mkdir -p "$HOME/starci-cache/go-mod"
            env -i \
              HOME="$starci_root/home" \
              TMPDIR="$starci_root/tmp" \
              LANG=C.UTF-8 \
              STARCI_WORKSPACE="$PWD" \
              'CGO_ENABLED=0' \
              GOCACHE="$HOME/starci-cache/go-build" \
              GOMODCACHE="$HOME/starci-cache/go-mod" \
              PATH="$HOME/starci-tools/go/go/bin:""$PATH" \
              /bin/sh -c "$STARCI_RUN"
      - save_cache:
          name: "Save cache: go-build"
          key: starci-cache-go-build-{{ .Revision }}
          paths:
            - ~/starci-cache/go-build
      - save_cache:
          name: "Save cache: go-mod"
          key: starci-cache-go-mod-{{ .Revision }}
          paths:
            - ~/starci-cache/go-mod

