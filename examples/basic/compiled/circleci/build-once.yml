# Generated by `starci compile --target circleci` from build-once.ci.star. Edit that, not this.
#
# Each job is one step of the plan: the same image, command, tools and
# packages, given only the step's inputs. A job skips its work when it has
# already passed with the same inputs.
#
# What does not carry over:
#  - Passes are remembered in this project's CircleCI cache, which expires.
#    starci's own store does not.
#  - Artifacts are handed from job to job through the workflow's workspace.
#    What a job kept is also in its record of a pass, so a job skipped because
#    it passed before still hands it on.

version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/cmd' '/go.mod' '/go.sum' '/internal'
      - run:
          name: "Identify the inputs"
          command: |
            git ls-files -s -- ':(top,literal)cmd' ':(top,literal)go.mod' ':(top,literal)go.sum' ':(top,literal)internal' > /tmp/starci-inputs
      - restore_cache:
          name: Has this already passed with these inputs?
          keys:
            - starci-passed-build-419567f44a988eb2-{{ checksum "/tmp/starci-inputs" }}
      - run:
          name: "What it kept when it passed before"
          command: |
            mkdir -p /tmp/starci-out/build/hit
            if [ -e ~/starci-passed/at ]; then
              cp -R ~/starci-kept/. /tmp/starci-out/build/hit/ && touch /tmp/starci-out/build/hit/.starci-kept
            fi
      - persist_to_workspace:
          root: /tmp/starci-out
          paths:
            - build/hit
      - run:
          name: "Stop here if it has"
          command: |
            if [ -e ~/starci-passed/at ]; then
              echo "Passed before with the same inputs, on $(cat ~/starci-passed/at). Nothing to do."
              circleci-agent step halt
            fi
      - run:
          name: "build"
          environment:
            STARCI_RUN: |-
              CGO_ENABLED=0 go build -o out/app ./cmd/app
          command: |
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              golang:1.23-bookworm sh -c "$STARCI_RUN"
      - run:
          name: "Keep out/app"
          command: |
            rm -rf ~/starci-kept && mkdir -p ~/starci-kept
            rm -rf /tmp/starci-out/build/ran && mkdir -p /tmp/starci-out/build/ran
            if [ ! -e 'out/app' ]; then echo 'keep out/app: the step passed without making it'; exit 1; fi
            mkdir -p "$(dirname ~/starci-kept/'out/app')" && cp -R 'out/app' ~/starci-kept/'out/app'
            mkdir -p "$(dirname /tmp/starci-out/build/ran/'out/app')" && cp -R 'out/app' /tmp/starci-out/build/ran/'out/app'
            touch /tmp/starci-out/build/ran/.starci-kept
      - persist_to_workspace:
          root: /tmp/starci-out
          paths:
            - build/ran
      - run:
          name: "Remember this pass"
          command: |
            mkdir -p ~/starci-passed && date > ~/starci-passed/at
      - save_cache:
          key: starci-passed-build-419567f44a988eb2-{{ checksum "/tmp/starci-inputs" }}
          paths:
            - ~/starci-passed
            - ~/starci-kept

  smoke-debian:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/starci-given
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/README.md'
      - run:
          name: "Identify the inputs"
          command: |
            git ls-files -s -- ':(top,literal)README.md' > /tmp/starci-inputs
            kept_hash() { find "$1" -type f | LC_ALL=C sort | while IFS= read -r f; do printf '%s %s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$([ -x "$f" ] && echo x || echo -)" "${f#"$1"}"; done | sha256sum | cut -c1-64; }
            echo "artifact 'app' $(kept_hash "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app')" >> /tmp/starci-inputs
      - restore_cache:
          name: Has this already passed with these inputs?
          keys:
            - starci-passed-smoke-debian-20fed0bf02c0c461-{{ checksum "/tmp/starci-inputs" }}
      - run:
          name: "Stop here if it has"
          command: |
            if [ -e ~/starci-passed/at ]; then
              echo "Passed before with the same inputs, on $(cat ~/starci-passed/at). Nothing to do."
              circleci-agent step halt
            fi
      - run:
          name: "Put the artifacts in place"
          command: |
            if [ -e 'app' ]; then echo 'artifact at app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
            mkdir -p "$(dirname 'app')" && cp -R "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app' 'app'
      - run:
          name: "smoke debian"
          environment:
            STARCI_RUN: |-
              ./app --version
          command: |
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              debian:12-slim sh -c "$STARCI_RUN"
      - run:
          name: "Remember this pass"
          command: |
            mkdir -p ~/starci-passed && date > ~/starci-passed/at
      - save_cache:
          key: starci-passed-smoke-debian-20fed0bf02c0c461-{{ checksum "/tmp/starci-inputs" }}
          paths:
            - ~/starci-passed

  smoke-alpine:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/starci-given
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/README.md'
      - run:
          name: "Identify the inputs"
          command: |
            git ls-files -s -- ':(top,literal)README.md' > /tmp/starci-inputs
            kept_hash() { find "$1" -type f | LC_ALL=C sort | while IFS= read -r f; do printf '%s %s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$([ -x "$f" ] && echo x || echo -)" "${f#"$1"}"; done | sha256sum | cut -c1-64; }
            echo "artifact 'app' $(kept_hash "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app')" >> /tmp/starci-inputs
      - restore_cache:
          name: Has this already passed with these inputs?
          keys:
            - starci-passed-smoke-alpine-8db3eef2e9c9b4f7-{{ checksum "/tmp/starci-inputs" }}
      - run:
          name: "Stop here if it has"
          command: |
            if [ -e ~/starci-passed/at ]; then
              echo "Passed before with the same inputs, on $(cat ~/starci-passed/at). Nothing to do."
              circleci-agent step halt
            fi
      - run:
          name: "Put the artifacts in place"
          command: |
            if [ -e 'app' ]; then echo 'artifact at app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
            mkdir -p "$(dirname 'app')" && cp -R "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app' 'app'
      - run:
          name: "smoke alpine"
          environment:
            STARCI_RUN: |-
              ./app --version
          command: |
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              alpine:3 sh -c "$STARCI_RUN"
      - run:
          name: "Remember this pass"
          command: |
            mkdir -p ~/starci-passed && date > ~/starci-passed/at
      - save_cache:
          key: starci-passed-smoke-alpine-8db3eef2e9c9b4f7-{{ checksum "/tmp/starci-inputs" }}
          paths:
            - ~/starci-passed

  end-to-end:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/starci-given
      - run:
          name: "Keep only this step's inputs"
          command: |
            git sparse-checkout set --no-cone '/e2e'
      - run:
          name: "Identify the inputs"
          command: |
            git ls-files -s -- ':(top,literal)e2e' > /tmp/starci-inputs
            kept_hash() { find "$1" -type f | LC_ALL=C sort | while IFS= read -r f; do printf '%s %s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$([ -x "$f" ] && echo x || echo -)" "${f#"$1"}"; done | sha256sum | cut -c1-64; }
            echo "artifact 'bin/app' $(kept_hash "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app')" >> /tmp/starci-inputs
      - restore_cache:
          name: Has this already passed with these inputs?
          keys:
            - starci-passed-end-to-end-9adf421bd96d2346-{{ checksum "/tmp/starci-inputs" }}
      - run:
          name: "Stop here if it has"
          command: |
            if [ -e ~/starci-passed/at ]; then
              echo "Passed before with the same inputs, on $(cat ~/starci-passed/at). Nothing to do."
              circleci-agent step halt
            fi
      - run:
          name: "Put the artifacts in place"
          command: |
            if [ -e 'bin/app' ]; then echo 'artifact at bin/app: it is already in the workspace, from the step'\''s inputs'; exit 1; fi
            mkdir -p "$(dirname 'bin/app')" && cp -R "$(d=/tmp/starci-given/build; [ -e $d/ran/.starci-kept ] && echo $d/ran || echo $d/hit)"/'out/app' 'bin/app'
      - run:
          name: "end to end"
          environment:
            STARCI_RUN: |-
              APP=./bin/app ./e2e/run.sh
          command: |
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              debian:12-slim sh -c "$STARCI_RUN"
      - run:
          name: "Remember this pass"
          command: |
            mkdir -p ~/starci-passed && date > ~/starci-passed/at
      - save_cache:
          key: starci-passed-end-to-end-9adf421bd96d2346-{{ checksum "/tmp/starci-inputs" }}
          paths:
            - ~/starci-passed

workflows:
  ci:
    jobs:
      - build
      - smoke-debian:
          requires: [build]
      - smoke-alpine:
          requires: [build]
      - end-to-end:
          requires: [build]
