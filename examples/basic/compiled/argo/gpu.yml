# Generated by `starci compile --target argo` from gpu.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The pods then need
#    the store's credentials from the cluster. A pass is keyed on the step's
#    image by name: a tag that moves does not run it again.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "unit"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"unit\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/test_runs.py tests/test_runs2.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/test_runs.py\",\"tests/test_runs2.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "ghcr.io/astral-sh/uv:python3.13-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    uv sync --frozen && uv run pytest -q tests/test_runs.py tests/test_runs2.py
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"unit\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/test_runs.py tests/test_runs2.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/test_runs.py\",\"tests/test_runs2.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "integration"
            inline:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      preference:
                        matchExpressions:
                          - key: "speed"
                            operator: "In"
                            values:
                              - "fast"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"integration\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/integration/**/*.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/integration/**/*.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{\"speed\":\"fast\"},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "ghcr.io/astral-sh/uv:python3.13-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    uv sync --frozen && uv run pytest -q tests/integration/**/*.py
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"integration\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/integration/**/*.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/integration/**/*.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{\"speed\":\"fast\"},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "gpu"
            inline:
              nodeSelector:
                gpu: "true"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"gpu\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/test_gpu.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/test_gpu.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{\"gpu\":\"true\"},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "ghcr.io/astral-sh/uv:python3.13-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    uv sync --frozen && uv run pytest -q tests/test_gpu.py
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"gpu\",\"image\":\"ghcr.io/astral-sh/uv:python3.13-bookworm-slim\",\"run\":\"uv sync --frozen && uv run pytest -q tests/test_gpu.py\",\"needs\":[],\"env\":{},\"inputs\":[\"pyproject.toml\",\"src/**/*.py\",\"tests/conftest.py\",\"tests/test_gpu.py\",\"uv.lock\"],\"caches\":{},\"cache\":true,\"on\":{\"gpu\":\"true\"},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
