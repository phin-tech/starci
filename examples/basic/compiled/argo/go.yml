# Generated by `starci compile --target argo` from go.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step's caches (vet, test, build linux/amd64, build linux/arm64, build
#    darwin/arm64) are directories of the pod and are gone when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "vet"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-go-build"
                  emptyDir: {}
                - name: "cache-go-mod"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"vet\",\"image\":\"registry.example/starci-bare:latest\",\"run\":\"go vet ./...\",\"needs\":[],\"env\":{\"CGO_ENABLED\":\"0\"},\"inputs\":[\"**/*.go\",\"go.mod\",\"go.sum\"],\"caches\":{\"go-build\":\"GOCACHE\",\"go-mod\":\"GOMODCACHE\"},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"go\",\"url\":\"https://go.dev/dl/go1.26.5.{os}-{arch}.tar.gz\",\"sha256\":{\"amd64\":\"5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053\",\"arm64\":\"fe4789e92b1f33358680864bbe8704289e7bb5fc207d80623c308935bd696d49\",\"darwin/amd64\":\"6231d8d3b8f5552ec6cbf6d685bdd5482e1e703214b120e89b3bf0d7bf1ef725\",\"darwin/arm64\":\"efb87ff28af9a188d0536ef5d42e63dd52ba8263cd7344a993cc48dd11dedb6a\"},\"arch_names\":{},\"bin\":[\"go/bin\"]}],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="$(cat /opt/starci/path):"$PATH; export PATH
                    go vet ./...
                env:
                  - name: "CGO_ENABLED"
                    value: "0"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-go-build"
                    mountPath: "GOCACHE"
                  - name: "cache-go-mod"
                    mountPath: "GOMODCACHE"
                  - name: "starci"
                    mountPath: "/opt/starci"
