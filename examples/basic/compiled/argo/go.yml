# Generated by `starci compile --target argo` from go.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step's caches (vet, test, build linux/amd64, build linux/arm64, build
#    darwin/arm64) are directories of the pod and are gone when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "vet"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-go-build"
                  emptyDir: {}
                - name: "cache-go-mod"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.go' '/go.mod' '/go.sum'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/go"
                      curl -fsSL 'https://go.dev/dl/go1.26.5.{os}-amd64.tar.gz' -o "/tmp/go.download"
                      echo "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053  /tmp/go.download" | sha256sum -c -
                      tar -xf "/tmp/go.download" -C "/opt/starci/tools/go"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/go/go/bin:"$PATH; export PATH
                    go vet ./...
                env:
                  - name: "CGO_ENABLED"
                    value: "0"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-go-build"
                    mountPath: "GOCACHE"
                  - name: "cache-go-mod"
                    mountPath: "GOMODCACHE"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "test"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
