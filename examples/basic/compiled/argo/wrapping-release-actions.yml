# Generated by `starci compile --target argo` from wrapping-release-actions.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - The script looks at the tag's name. That does not carry over: every tag is
#    treated alike.
#  - A step is not skipped because it passed before with the same inputs: every
#    step runs every time. Remembering passes needs a starci command to ask the
#    shared store, which does not exist yet.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.go' '/go.mod' '/go.sum'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "golang:1.26"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "go test ./..."
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "push-image"
            dependencies:
              - "test"
            when: "{{=workflow.parameters.event == 'tag'}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "docker:27-cli"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "echo \"$REGISTRY_TOKEN\" | docker login ghcr.io -u \"$REGISTRY_USER\" --password-stdin && docker build -t ghcr.io/sam/app:0.0.0 -t ghcr.io/sam/app:0.0 -t ghcr.io/sam/app:0 -t ghcr.io/sam/app:latest . && docker push ghcr.io/sam/app:0.0.0 && docker push ghcr.io/sam/app:0.0 && docker push ghcr.io/sam/app:0 && docker push ghcr.io/sam/app:latest"
                env:
                  - name: "REGISTRY_TOKEN"
                    value: ""
                  - name: "REGISTRY_USER"
                    value: ""
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "goreleaser"
            dependencies:
              - "test"
            when: "{{=workflow.parameters.event == 'tag'}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "goreleaser/goreleaser:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "goreleaser release --clean"
                env:
                  - name: "GITHUB_TOKEN"
                    value: ""
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
