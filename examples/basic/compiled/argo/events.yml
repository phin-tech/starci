# Generated by `starci compile --target argo` from events.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - The script looks at the pull request. Whether it comes from a fork carries
#    over; any other rule about it does not, and every pull request is treated
#    as one into main.
#  - The script looks at the branch. Whether it is main carries over; any other
#    rule about branch names does not, and every other branch is treated alike.
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The pods then need
#    the store's credentials from the cluster. A pass is keyed on the step's
#    image by name: a tag that moves does not run it again.
#  - A schedule is a CronWorkflow you create from this template, with the
#    `event` parameter set to schedule and `schedule` to its name. Overlap and
#    catch-up are Argo's to decide.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "lint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"lint\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run lint\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    npm ci && npm run lint
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"lint\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run lint\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"test\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm test\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    npm ci && npm test
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"test\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm test\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "deploy-staging"
            dependencies:
              - "lint"
              - "test"
            when: "{{=(workflow.parameters.event == 'push' && workflow.parameters.ref == 'main')}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"deploy staging\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run deploy:staging\",\"needs\":[\"lint\",\"test\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "npm ci && npm run deploy:staging"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "publish"
            dependencies:
              - "lint"
              - "test"
            when: "{{=workflow.parameters.event == 'tag'}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"publish\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm publish\",\"needs\":[\"lint\",\"test\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "npm ci && npm publish"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "preview"
            dependencies:
              - "lint"
              - "test"
            when: "{{=(workflow.parameters.event == 'pull_request' && workflow.parameters.fork == 'false')}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"preview\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run deploy:preview\",\"needs\":[\"lint\",\"test\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "npm ci && npm run deploy:preview"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "end-to-end"
            dependencies:
              - "lint"
              - "test"
            when: "{{=(workflow.parameters.event == 'schedule' && workflow.parameters.schedule == 'nightly')}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"end to end\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run test:e2e\",\"needs\":[\"lint\",\"test\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    npm ci && npm run test:e2e
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"end to end\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm run test:e2e\",\"needs\":[\"lint\",\"test\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "audit"
            when: "{{=(workflow.parameters.event == 'schedule' && workflow.parameters.schedule == 'nightly')}}"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"audit\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm audit --audit-level=high\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "npm ci && npm audit --audit-level=high"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
