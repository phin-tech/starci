# Generated by `starci compile --target argo` from shell-scripts.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The init image
#    must then hold starci, and the pods need the store's credentials from the
#    cluster. A pass is keyed on the step's image by name: a tag that moves
#    does not run it again.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "shellcheck"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/scripts/*.sh'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/shellcheck"
                      curl -fsSL 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz' -o "/tmp/shellcheck.download"
                      echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.download" | sha256sum -c -
                      tar -xf "/tmp/shellcheck.download" -C "/opt/starci/tools/shellcheck"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"shellcheck\",\"image\":\"debian:12-slim\",\"run\":\"shellcheck scripts/*.sh\",\"needs\":[],\"env\":{},\"inputs\":[\"scripts/*.sh\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"shellcheck\",\"url\":\"https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.{arch}.tar.xz\",\"sha256\":{\"amd64\":\"8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198\",\"arm64\":\"12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588\"},\"arch_names\":{\"amd64\":\"x86_64\",\"arm64\":\"aarch64\"},\"bin\":[\"shellcheck-v0.11.0\"]}],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    PATH="/opt/starci/tools/shellcheck/shellcheck-v0.11.0:"$PATH; export PATH
                    (
                    shellcheck scripts/*.sh
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'shellcheck' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "json-is-valid"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/config/*.json'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/jq"
                      curl -fsSL 'https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64' -o "/tmp/jq.download"
                      echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  /tmp/jq.download" | sha256sum -c -
                      install -m 755 "/tmp/jq.download" "/opt/starci/tools/jq/jq"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"json is valid\",\"image\":\"debian:12-slim\",\"run\":\"for f in config/*.json; do jq empty \\\"$f\\\" || exit 1; done\",\"needs\":[],\"env\":{},\"inputs\":[\"config/*.json\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"jq\",\"url\":\"https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-{arch}\",\"sha256\":{\"amd64\":\"020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d\",\"arm64\":\"6bc62f25981328edd3cfcfe6fe51b073f2d7e7710d7ef7fcdac28d4e384fc3d4\"},\"arch_names\":{},\"bin\":[\".\"]}],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    PATH="/opt/starci/tools/jq:"$PATH; export PATH
                    (
                    for f in config/*.json; do jq empty "$f" || exit 1; done
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'json is valid' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
