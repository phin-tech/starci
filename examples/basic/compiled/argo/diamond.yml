# Generated by `starci compile --target argo` from diamond.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "build"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"build\",\"image\":\"registry.example/starci-bare:latest\",\"run\":\"npm ci && npm run build\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"node\",\"url\":\"https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-{arch}.tar.gz\",\"sha256\":{\"amd64\":\"b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406\",\"arm64\":\"f7a1e486dbc8b286847815b477d4fb5e9fb963ed4489c3e1588853d685f589f9\",\"darwin/amd64\":\"efcc2b0db6f94bf53eddb038fe2b370277a042bd29e4f19b8f8e23598795b819\",\"darwin/arm64\":\"c9e1dbc748b33ed2d14f42445191ecaf14c56259c7a9a26d0042c49ec2b66428\"},\"arch_names\":{\"amd64\":\"x64\"},\"bin\":[\"node-v22.23.4-{os}-{arch}/bin\"]}],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="$(cat /opt/starci/path):"$PATH; export PATH
                    npm ci && npm run build
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "lint"
            dependencies:
              - "build"
