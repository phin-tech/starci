                    readOnly: true
          - name: "package"
            dependencies:
              - "lint"
              - "test"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
