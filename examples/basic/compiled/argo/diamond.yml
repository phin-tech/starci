# Generated by `starci compile --target argo` from diamond.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "build"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/node"
                      curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
                      echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
                      tar -xf "/tmp/node.download" -C "/opt/starci/tools/node"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/node/node-v22.23.4-{os}-x64/bin:"$PATH; export PATH
                    npm ci && npm run build
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "lint"
            dependencies:
              - "build"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/node"
                      curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
                      echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
                      tar -xf "/tmp/node.download" -C "/opt/starci/tools/node"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/node/node-v22.23.4-{os}-x64/bin:"$PATH; export PATH
                    npm ci && npm run lint
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "test"
            dependencies:
              - "build"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/node"
                      curl -fsSL 'https://nodejs.org/dist/v22.23.4/node-v22.23.4-{os}-x64.tar.gz' -o "/tmp/node.download"
                      echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.download" | sha256sum -c -
                      tar -xf "/tmp/node.download" -C "/opt/starci/tools/node"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "registry.example/starci-bare:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/node/node-v22.23.4-{os}-x64/bin:"$PATH; export PATH
                    npm ci && npm test
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "package"
            dependencies:
              - "lint"
              - "test"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
