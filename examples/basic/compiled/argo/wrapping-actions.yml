# Generated by `starci compile --target argo` from wrapping-actions.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step is not skipped because it passed before with the same inputs: every
#    step runs every time. Remembering passes needs a starci command to ask the
#    shared store, which does not exist yet.
#  - A step's caches (web test, api test) are directories of the pod and are
#    gone when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "web-test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-npm-22"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/web'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "npm ci && npm test"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-npm-22"
                    mountPath: "/root/.npm"
          - name: "api-test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-pip-3-13"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "python:3.13-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "pip install -e . && pytest -q"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-pip-3-13"
                    mountPath: "/root/.cache/pip"
          - name: "trivy"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "aquasec/trivy:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "trivy fs --scanners vuln,secret --severity CRITICAL --exit-code 1 ."
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "hadolint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/Dockerfile'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "hadolint/hadolint:latest-debian"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "hadolint --failure-threshold warning Dockerfile"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "image"
            dependencies:
              - "web-test"
              - "api-test"
              - "trivy"
              - "hadolint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "docker:27-cli"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "docker build -t app:ci --build-arg NODE_VERSION=22 -f Dockerfile ."
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
