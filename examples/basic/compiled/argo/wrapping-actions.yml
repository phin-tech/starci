# Generated by `starci compile --target argo` from wrapping-actions.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The pods then need
#    the store's credentials from the cluster. A pass is keyed on the step's
#    image by name: a tag that moves does not run it again.
#  - A step's caches (web test, api test) are directories of the pod and are
#    gone when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "web-test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-npm-22"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"web test\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm test\",\"needs\":[],\"env\":{},\"inputs\":[\"web\"],\"caches\":{\"npm-22\":\"/root/.npm\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "node:22-bookworm-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    npm ci && npm test
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"web test\",\"image\":\"node:22-bookworm-slim\",\"run\":\"npm ci && npm test\",\"needs\":[],\"env\":{},\"inputs\":[\"web\"],\"caches\":{\"npm-22\":\"/root/.npm\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-npm-22"
                    mountPath: "/root/.npm"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "api-test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-pip-3-13"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"api test\",\"image\":\"python:3.13-slim\",\"run\":\"pip install -e . && pytest -q\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{\"pip-3-13\":\"/root/.cache/pip\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "python:3.13-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    pip install -e . && pytest -q
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"api test\",\"image\":\"python:3.13-slim\",\"run\":\"pip install -e . && pytest -q\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{\"pip-3-13\":\"/root/.cache/pip\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-pip-3-13"
                    mountPath: "/root/.cache/pip"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "trivy"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"trivy\",\"image\":\"aquasec/trivy:latest\",\"run\":\"trivy fs --scanners vuln,secret --severity CRITICAL --exit-code 1 .\",\"needs\":[],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":false,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "aquasec/trivy:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "trivy fs --scanners vuln,secret --severity CRITICAL --exit-code 1 ."
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "hadolint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"hadolint\",\"image\":\"hadolint/hadolint:latest-debian\",\"run\":\"hadolint --failure-threshold warning Dockerfile\",\"needs\":[],\"env\":{},\"inputs\":[\"Dockerfile\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "hadolint/hadolint:latest-debian"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    hadolint --failure-threshold warning Dockerfile
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"hadolint\",\"image\":\"hadolint/hadolint:latest-debian\",\"run\":\"hadolint --failure-threshold warning Dockerfile\",\"needs\":[],\"env\":{},\"inputs\":[\"Dockerfile\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "image"
            dependencies:
              - "web-test"
              - "api-test"
              - "trivy"
              - "hadolint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"image\",\"image\":\"docker:27-cli\",\"run\":\"docker build -t app:ci --build-arg NODE_VERSION=22 -f Dockerfile .\",\"needs\":[\"web test\",\"api test\",\"trivy\",\"hadolint\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "docker:27-cli"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    (
                    docker build -t app:ci --build-arg NODE_VERSION=22 -f Dockerfile .
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"image\",\"image\":\"docker:27-cli\",\"run\":\"docker build -t app:ci --build-arg NODE_VERSION=22 -f Dockerfile .\",\"needs\":[\"web test\",\"api test\",\"trivy\",\"hadolint\"],\"env\":{},\"inputs\":[\".\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
