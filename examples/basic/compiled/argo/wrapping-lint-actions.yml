# Generated by `starci compile --target argo` from wrapping-lint-actions.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - The script decides by which files a commit changed. A workflow file
#    cannot, so it does what the script does when nothing is known about the
#    changes, on every run.
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The init image
#    must then hold starci, and the pods need the store's credentials from the
#    cluster. A pass is keyed on the step's image by name: a tag that moves
#    does not run it again.
#  - A step's caches (golangci-lint) are directories of the pod and are gone
#    when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "golangci-lint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-go-build"
                  emptyDir: {}
                - name: "cache-golangci-lint"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.go' '/.golangci.y*ml' '/go.mod' '/go.sum'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"golangci-lint\",\"image\":\"golangci/golangci-lint:v2.1\",\"run\":\"cd . && golangci-lint run --timeout 5m\",\"needs\":[],\"env\":{},\"inputs\":[\"**/*.go\",\".golangci.y*ml\",\"go.mod\",\"go.sum\"],\"caches\":{\"go-build\":\"/root/.cache/go-build\",\"golangci-lint\":\"/root/.cache/golangci-lint\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "golangci/golangci-lint:v2.1"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    cd . && golangci-lint run --timeout 5m
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'golangci-lint' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-go-build"
                    mountPath: "/root/.cache/go-build"
                  - name: "cache-golangci-lint"
                    mountPath: "/root/.cache/golangci-lint"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "ruff"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.py' '/pyproject.toml' '/ruff.toml'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"ruff\",\"image\":\"ghcr.io/astral-sh/ruff:latest\",\"run\":\"ruff check .\",\"needs\":[],\"env\":{},\"inputs\":[\"**/*.py\",\"pyproject.toml\",\"ruff.toml\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "ghcr.io/astral-sh/ruff:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    ruff check .
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'ruff' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "shellcheck"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.sh'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"shellcheck\",\"image\":\"koalaman/shellcheck-alpine:stable\",\"run\":\"find . -name '*.sh' -not -path './vendor/*' -exec shellcheck --severity=warning {} +\",\"needs\":[],\"env\":{},\"inputs\":[\"**/*.sh\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "koalaman/shellcheck-alpine:stable"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    find . -name '*.sh' -not -path './vendor/*' -exec shellcheck --severity=warning {} +
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'shellcheck' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "actionlint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/.github/workflows'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"actionlint\",\"image\":\"rhysd/actionlint:latest\",\"run\":\"actionlint\",\"needs\":[],\"env\":{},\"inputs\":[\".github/workflows\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "rhysd/actionlint:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    actionlint
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'actionlint' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
