# Generated by `starci compile --target argo` from wrapping-lint-actions.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - The script decides by which files a commit changed. A workflow file
#    cannot, so it does what the script does when nothing is known about the
#    changes, on every run.
#  - A step is not skipped because it passed before with the same inputs: every
#    step runs every time. Remembering passes needs a starci command to ask the
#    shared store, which does not exist yet.
#  - A step's caches (golangci-lint) are directories of the pod and are gone
#    when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "golangci-lint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-go-build"
                  emptyDir: {}
                - name: "cache-golangci-lint"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.go' '/.golangci.y*ml' '/go.mod' '/go.sum'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "golangci/golangci-lint:v2.1"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "cd . && golangci-lint run --timeout 5m"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-go-build"
                    mountPath: "/root/.cache/go-build"
                  - name: "cache-golangci-lint"
                    mountPath: "/root/.cache/golangci-lint"
          - name: "ruff"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.py' '/pyproject.toml' '/ruff.toml'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "ghcr.io/astral-sh/ruff:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "ruff check ."
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "shellcheck"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/**/*.sh'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "koalaman/shellcheck-alpine:stable"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "find . -name '*.sh' -not -path './vendor/*' -exec shellcheck --severity=warning {} +"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
          - name: "actionlint"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/.github/workflows'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "rhysd/actionlint:latest"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "actionlint"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
