# Generated by `starci compile --target argo` from pi-gamebook-tools.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step is not skipped because it passed before with the same inputs: every
#    step runs every time. Remembering passes needs a starci command to ask the
#    shared store, which does not exist yet.
#  - A step's caches (check, test) are directories of the pod and are gone when
#    it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "check"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "tools"
                  emptyDir: {}
                - name: "cache-bun"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/bun.lock' '/index.ts' '/omp.ts' '/package.json' '/rules' '/src' '/test' '/tsconfig.json'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/bun"
                      curl -fsSL 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip' -o "/tmp/bun.download"
                      echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.download" | sha256sum -c -
                      unzip -q "/tmp/bun.download" -d "/opt/starci/tools/bun"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "tools"
                      mountPath: "/opt/starci/tools"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/bun/bun-linux-x64:"$PATH; export PATH
                    bun install --frozen-lockfile && bun run check
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-bun"
                    mountPath: "/root/.bun/install/cache"
                  - name: "tools"
                    mountPath: "/opt/starci/tools"
                    readOnly: true
          - name: "test"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "tools"
                  emptyDir: {}
                - name: "cache-bun"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/bun.lock' '/index.ts' '/omp.ts' '/package.json' '/rules' '/src' '/test' '/tsconfig.json'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      mkdir -p "/opt/starci/tools/bun"
                      curl -fsSL 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip' -o "/tmp/bun.download"
                      echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.download" | sha256sum -c -
                      unzip -q "/tmp/bun.download" -d "/opt/starci/tools/bun"
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "tools"
                      mountPath: "/opt/starci/tools"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    PATH="/opt/starci/tools/bun/bun-linux-x64:"$PATH; export PATH
                    bun install --frozen-lockfile && bun test
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-bun"
                    mountPath: "/root/.bun/install/cache"
                  - name: "tools"
                    mountPath: "/opt/starci/tools"
                    readOnly: true
