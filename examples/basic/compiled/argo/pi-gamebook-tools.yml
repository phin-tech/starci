# Generated by `starci compile --target argo` from pi-gamebook-tools.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The pods then need
#    the store's credentials from the cluster. A pass is keyed on the step's
#    image by name: a tag that moves does not run it again.
#  - A step's caches (check, test) are directories of the pod and are gone when
#    it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "check"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-bun"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"check\",\"image\":\"debian:12-slim\",\"run\":\"bun install --frozen-lockfile && bun run check\",\"needs\":[],\"env\":{},\"inputs\":[\"bun.lock\",\"index.ts\",\"omp.ts\",\"package.json\",\"rules\",\"src\",\"test\",\"tsconfig.json\"],\"caches\":{\"bun\":\"/root/.bun/install/cache\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"bun\",\"url\":\"https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-{arch}.zip\",\"sha256\":{\"amd64\":\"951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f\",\"arm64\":\"a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b\"},\"arch_names\":{\"amd64\":\"x64\",\"arm64\":\"aarch64\"},\"bin\":[\"bun-linux-{arch}\"]}],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    PATH="$(cat /opt/starci/path):"$PATH; export PATH
                    (
                    bun install --frozen-lockfile && bun run check
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"check\",\"image\":\"debian:12-slim\",\"run\":\"bun install --frozen-lockfile && bun run check\",\"needs\":[],\"env\":{},\"inputs\":[\"bun.lock\",\"index.ts\",\"omp.ts\",\"package.json\",\"rules\",\"src\",\"test\",\"tsconfig.json\"],\"caches\":{\"bun\":\"/root/.bun/install/cache\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"bun\",\"url\":\"https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-{arch}.zip\",\"sha256\":{\"amd64\":\"951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f\",\"arm64\":\"a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b\"},\"arch_names\":{\"amd64\":\"x64\",\"arm64\":\"aarch64\"},\"bin\":[\"bun-linux-{arch}\"]}],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-bun"
                    mountPath: "/root/.bun/install/cache"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "test"
            inline:
              nodeSelector:
                kubernetes.io/arch: "amd64"
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
                - name: "cache-bun"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "starci"
                    - "pod"
                    - "prepare"
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"test\",\"image\":\"debian:12-slim\",\"run\":\"bun install --frozen-lockfile && bun test\",\"needs\":[],\"env\":{},\"inputs\":[\"bun.lock\",\"index.ts\",\"omp.ts\",\"package.json\",\"rules\",\"src\",\"test\",\"tsconfig.json\"],\"caches\":{\"bun\":\"/root/.bun/install/cache\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"bun\",\"url\":\"https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-{arch}.zip\",\"sha256\":{\"amd64\":\"951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f\",\"arm64\":\"a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b\"},\"arch_names\":{\"amd64\":\"x64\",\"arm64\":\"aarch64\"},\"bin\":[\"bun-linux-{arch}\"]}],\"packages\":[]}"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/opt/starci/state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "debian:12-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then
                      echo 'starci: passed before with the same inputs; not run again'
                      exit 0
                    fi
                    PATH="$(cat /opt/starci/path):"$PATH; export PATH
                    (
                    bun install --frozen-lockfile && bun test
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ]; then /opt/starci/starci pod finish || exit 1; fi
                    exit $rc
                env:
                  - name: "STARCI_STEP"
                    value: "{\"name\":\"test\",\"image\":\"debian:12-slim\",\"run\":\"bun install --frozen-lockfile && bun test\",\"needs\":[],\"env\":{},\"inputs\":[\"bun.lock\",\"index.ts\",\"omp.ts\",\"package.json\",\"rules\",\"src\",\"test\",\"tsconfig.json\"],\"caches\":{\"bun\":\"/root/.bun/install/cache\"},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[{\"name\":\"bun\",\"url\":\"https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-{arch}.zip\",\"sha256\":{\"amd64\":\"951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f\",\"arm64\":\"a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b\"},\"arch_names\":{\"amd64\":\"x64\",\"arm64\":\"aarch64\"},\"bin\":[\"bun-linux-{arch}\"]}],\"packages\":[]}"
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-bun"
                    mountPath: "/root/.bun/install/cache"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
