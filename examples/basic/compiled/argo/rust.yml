# Generated by `starci compile --target argo` from rust.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - A step is not skipped because it passed before with the same inputs: every
#    step runs every time. Remembering passes needs a starci command to ask the
#    shared store, which does not exist yet.
#  - A step's caches (fmt, clippy, test, release build) are directories of the
#    pod and are gone when it ends.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "fmt"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-cargo-registry"
                  emptyDir: {}
                - name: "cache-cargo-target"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/Cargo.lock' '/Cargo.toml' '/src' '/tests'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "rust:1-slim-bookworm"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "rustup component add rustfmt && cargo fmt --check"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-cargo-registry"
                    mountPath: "/usr/local/cargo/registry"
                  - name: "cache-cargo-target"
                    mountPath: "/workspace/target"
          - name: "clippy"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-cargo-registry"
                  emptyDir: {}
                - name: "cache-cargo-target"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/Cargo.lock' '/Cargo.toml' '/src' '/tests'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "rust:1-slim-bookworm"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "rustup component add clippy && cargo clippy --all-targets -- -D warnings"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-cargo-registry"
                    mountPath: "/usr/local/cargo/registry"
                  - name: "cache-cargo-target"
                    mountPath: "/workspace/target"
          - name: "test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-cargo-registry"
                  emptyDir: {}
                - name: "cache-cargo-target"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/Cargo.lock' '/Cargo.toml' '/src' '/tests'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "rust:1-slim-bookworm"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "cargo test --locked"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-cargo-registry"
                    mountPath: "/usr/local/cargo/registry"
                  - name: "cache-cargo-target"
                    mountPath: "/workspace/target"
          - name: "release-build"
            dependencies:
              - "fmt"
              - "clippy"
              - "test"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "cache-cargo-registry"
                  emptyDir: {}
                - name: "cache-cargo-target"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/Cargo.lock' '/Cargo.toml' '/src' '/tests'
                      git fetch -q --depth 1 origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
              container:
                name: "main"
                image: "rust:1-slim-bookworm"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - "cargo build --release --locked"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "cache-cargo-registry"
                    mountPath: "/usr/local/cargo/registry"
                  - name: "cache-cargo-target"
                    mountPath: "/workspace/target"
