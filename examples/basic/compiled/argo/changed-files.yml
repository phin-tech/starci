# Generated by `starci compile --target argo` from changed-files.ci.star. Edit that, not this.
#
# Each task is one step of the plan: a pod in the step's image, given only the
# step's inputs and tools. The init container image is
# registry.example/starci-init:latest.
#
#   kubectl apply -n NAMESPACE -f THIS-FILE
#   argo submit -n NAMESPACE --from workflowtemplate/starci -p clone_url=URL -p sha=SHA \
#     [-p event=push|tag|pull_request|schedule|manual -p ref=BRANCH -p tag=NAME -p fork=true]
#
# What does not carry over:
#  - The script decides by which files a commit changed. A workflow file
#    cannot, so it does what the script does when nothing is known about the
#    changes, on every run.
#  - A step with cache = True is skipped when it passed before with the same
#    inputs, if the `store` parameter names a shared store (STARCI_STORE, as
#    for a machine); without one every step runs every time. The init image
#    must then hold starci, and the pods need the store's credentials from the
#    cluster. A pass is keyed on the step's image by name: a tag that moves
#    does not run it again.
#  - A step that fails fails its pod and is not run again; a pod lost to its
#    node is tried again, twice. Steps that need a failed step are omitted by
#    Argo, not skipped.

apiVersion: "argoproj.io/v1alpha1"
kind: "WorkflowTemplate"
metadata:
  name: "starci"
spec:
  entrypoint: "ci"
  arguments:
    parameters:
      - name: "clone_url"
      - name: "sha"
      - name: "event"
        value: "push"
      - name: "ref"
        value: ""
      - name: "tag"
        value: ""
      - name: "schedule"
        value: ""
      - name: "fork"
        value: "false"
      - name: "store"
        value: ""
  templates:
    - name: "ci"
      dag:
        tasks:
          - name: "api-tests"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/api'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"api tests\",\"image\":\"python:3.13-slim\",\"run\":\"cd api && pip install -e . && pytest -q\",\"needs\":[],\"env\":{},\"inputs\":[\"api\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "python:3.13-slim"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    cd api && pip install -e . && pytest -q
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'api tests' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
          - name: "terraform-fmt"
            inline:
              retryStrategy:
                limit: 2
                retryPolicy: "OnError"
              volumes:
                - name: "workspace"
                  emptyDir: {}
                - name: "starci"
                  emptyDir: {}
              initContainers:
                - name: "starci-prepare"
                  image: "registry.example/starci-init:latest"
                  command:
                    - "sh"
                    - "-c"
                  args:
                    - |-
                      set -eu
                      cd /workspace
                      git init -q .
                      git remote add origin "$STARCI_CLONE_URL"
                      git sparse-checkout set --no-cone '/terraform'
                      git fetch -q --depth 1 --filter=blob:none origin "$STARCI_SHA"
                      git checkout -q FETCH_HEAD
                      if [ -n "${STARCI_STORE:-}" ]; then
                        mkdir -p /opt/starci
                        cp "$(command -v starci)" /opt/starci/starci
                        printf '%s' "$STARCI_STEP" | starci pass key > /opt/starci/key
                        if starci pass get "$(cat /opt/starci/key)"; then touch /opt/starci/hit; chmod -R a+rX /opt/starci; exit 0; fi
                        chmod -R a+rX /opt/starci
                      fi
                      rm -rf .git
                      chmod -R a+rwX /workspace
                      chmod -R a+rX /opt/starci/tools 2>/dev/null || true
                  env:
                    - name: "STARCI_CLONE_URL"
                      value: "{{workflow.parameters.clone_url}}"
                    - name: "STARCI_SHA"
                      value: "{{workflow.parameters.sha}}"
                    - name: "STARCI_STEP"
                      value: "{\"name\":\"terraform fmt\",\"image\":\"hashicorp/terraform:1.9\",\"run\":\"terraform fmt -check -recursive terraform\",\"needs\":[],\"env\":{},\"inputs\":[\"terraform\"],\"caches\":{},\"cache\":true,\"on\":{},\"prefer\":{},\"avoid\":{},\"tools\":[],\"packages\":[]}"
                    - name: "STARCI_ARCH"
                      value: "amd64"
                    - name: "STARCI_STORE"
                      value: "{{workflow.parameters.store}}"
                    - name: "STARCI_STATE"
                      value: "/tmp/starci-state"
                  volumeMounts:
                    - name: "workspace"
                      mountPath: "/workspace"
                    - name: "starci"
                      mountPath: "/opt/starci"
              container:
                name: "main"
                image: "hashicorp/terraform:1.9"
                workingDir: "/workspace"
                command:
                  - "sh"
                  - "-c"
                args:
                  - |-
                    if [ -e /opt/starci/hit ]; then echo 'starci: passed before with the same inputs; not run again'; exit 0; fi
                    (
                    terraform fmt -check -recursive terraform
                    )
                    rc=$?
                    if [ "$rc" -eq 0 ] && [ -e /opt/starci/key ]; then
                      /opt/starci/starci pass put "$(cat /opt/starci/key)" 'terraform fmt' || echo 'starci: could not record the pass' >&2
                    fi
                    exit $rc
                env:
                  - name: "STARCI_STORE"
                    value: "{{workflow.parameters.store}}"
                  - name: "STARCI_STATE"
                    value: "/tmp/starci-state"
                volumeMounts:
                  - name: "workspace"
                    mountPath: "/workspace"
                  - name: "starci"
                    mountPath: "/opt/starci"
                    readOnly: true
